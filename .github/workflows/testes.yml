name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar sintaxe
        run: python -m compileall -q core.py servidor.py tests
      - name: Testar logica de execucao
        run: python -m unittest discover -s tests -v
