name: Testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar SDK MCP oficial
        run: python -m pip install -r requirements.txt
      - name: Verificar carregamento do servidor MCP
        run: python -c "import servidor; assert servidor.mcp is not None"
      - name: Verificar sintaxe
        run: python -m compileall -q core.py servidor.py tarefas.py politica.py autorizar.py mini_ia.py aprendizado.py avaliacao_ia.py tests
      - name: Testar logica de execucao
        run: python -m unittest discover -s tests -v
      - name: Avaliar mini IA contra referencia P2 (sem regressao)
        run: python -m avaliacao_ia
